name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor Core & Android
        run: npm install --legacy-peer-deps --no-audit --no-fund @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0

      - name: Initialize Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Duplicate Kotlin Classes and Gradle Config
        run: |
          # Enable Jetifier
          if ! grep -q "android.enableJetifier" android/gradle.properties; then
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          # Ensure exclusions in android/app/build.gradle
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            sed -i '/dependencies {/i configurations.all {\n    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n}\n' android/app/build.gradle
          fi

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvayeIranAzad-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
