<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='50%' stop-color='#020617'/>
      <stop offset='100%' stop-color='#090d16'/>
    </linearGradient>
    <linearGradient id='glow' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#10b981'/>
      <stop offset='50%' stop-color='#6366f1'/>
      <stop offset='100%' stop-color='#f43f5e'/>
    </linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='8' stdDeviation='12' flood-color='#6366f1' flood-opacity='0.4'/>
    </filter>
  </defs>
  <rect width='512' height='512' rx='128' fill='url(#bg)'/>
  <rect x='16' y='16' width='480' height='480' rx='112' fill='none' stroke='url(#glow)' stroke-width='4' opacity='0.4'/>
  <g filter='url(#shadow)'>
    <!-- Sound Waves -->
    <path d='M110 256c0-60 40-110 100-125' stroke='#10b981' stroke-width='16' stroke-linecap='round' fill='none'/>
    <path d='M70 256c0-90 65-160 150-180' stroke='#10b981' stroke-width='14' stroke-linecap='round' fill='none' opacity='0.6'/>
    <path d='M402 256c0-60-40-110-100-125' stroke='#f43f5e' stroke-width='16' stroke-linecap='round' fill='none'/>
    <path d='M442 256c0-90-65-160-150-180' stroke='#f43f5e' stroke-width='14' stroke-linecap='round' fill='none' opacity='0.6'/>
    <!-- Center Microphone/Sound Core -->
    <rect x='216' y='140' width='80' height='150' rx='40' fill='url(#glow)'/>
    <path d='M176 240c0 48 36 84 80 84s80-36 80-84' fill='none' stroke='#f8fafc' stroke-width='16' stroke-linecap='round'/>
    <line x1='256' y1='324' x2='256' y2='390' stroke='#f8fafc' stroke-width='16' stroke-linecap='round'/>
    <line x1='196' y1='390' x2='316' y2='390' stroke='#f8fafc' stroke-width='16' stroke-linecap='round'/>
  </g>
</svg>